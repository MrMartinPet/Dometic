<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dometic App Portal</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#070b18;
  --panel:#111827;
  --card:#1e293b;
  --card2:#263244;
  --accent:#156082;
  --accent2:#2b7da6;
  --text:#f8fafc;
  --muted:#b6c3d4;
  --line:rgba(255,255,255,.10);
  --ok:#7dd3fc;
}
*{box-sizing:border-box;font-family:Segoe UI,Arial,sans-serif;}
body{
  margin:0;
  min-height:100vh;
  background:radial-gradient(circle at 20% 0%, rgba(21,96,130,.38), transparent 32%),linear-gradient(180deg,#101827 0%,#070b18 55%,#050816 100%);
  color:var(--text);
}
.wrapper{max-width:1320px;margin:0 auto;padding:34px 28px 24px;}
.hero{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-bottom:26px;}
.brand{display:flex;align-items:center;gap:16px;}
.logoBox{width:58px;height:58px;border-radius:16px;background:linear-gradient(135deg,#fff,#dbeafe);display:flex;align-items:center;justify-content:center;color:#0f172a;font-weight:800;letter-spacing:.5px;box-shadow:0 16px 40px rgba(0,0,0,.28);}
h1{margin:0;font-size:34px;letter-spacing:.2px;}
.subtitle{margin-top:8px;color:var(--muted);font-size:15px;}
.toolbar{display:flex;align-items:center;justify-content:flex-start;gap:16px;margin:0 0 22px;padding:14px 16px;border:1px solid var(--line);background:rgba(17,24,39,.55);border-radius:18px;backdrop-filter:blur(8px);}
.search{width:min(420px,100%);padding:12px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:rgba(15,23,42,.78);color:var(--text);outline:none;}
.notice{margin:0 0 18px;padding:13px 16px;border-radius:14px;background:rgba(21,96,130,.22);border:1px solid rgba(125,211,252,.18);color:#dbeafe;font-size:13px;display:none;}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;}
.card{position:relative;background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:22px;overflow:hidden;min-height:430px;box-shadow:0 24px 60px rgba(0,0,0,.34);transition:.18s ease;}
.card:hover{transform:translateY(-5px);border-color:rgba(159,227,255,.35);}
.image-wrap{height:185px;background:linear-gradient(135deg,#0f172a,#1e293b);border-bottom:1px solid var(--line);overflow:hidden;position:relative;}
.image-wrap img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(1.08) contrast(1.05);}
.image-wrap::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(0,0,0,.38));pointer-events:none;}
.content{padding:20px;}
.tag{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:#d9f3ff;background:rgba(21,96,130,.42);border:1px solid rgba(159,227,255,.18);padding:6px 10px;border-radius:999px;margin-bottom:12px;}
.dot{width:8px;height:8px;background:var(--ok);border-radius:999px;}
.app-title{font-size:22px;font-weight:700;margin:0 0 10px;}
.desc{color:var(--muted);font-size:14px;line-height:1.48;min-height:102px;margin-bottom:18px;}
.actions{display:flex;align-items:center;justify-content:space-between;gap:12px;}
.btn{display:inline-flex;align-items:center;justify-content:center;min-width:112px;padding:11px 16px;background:linear-gradient(180deg,var(--accent2),var(--accent));color:white;text-decoration:none;border-radius:11px;font-size:14px;font-weight:600;border:1px solid rgba(255,255,255,.16);}
.linktext{font-size:12px;color:#93c5fd;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px;}
.footer{margin-top:34px;padding-top:18px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:18px;color:var(--muted);font-size:12px;}
.empty{grid-column:1/-1;padding:24px;border:1px dashed rgba(255,255,255,.18);border-radius:18px;color:var(--muted);text-align:center;}
@media(max-width:1050px){.grid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:720px){.wrapper{padding:22px 14px;}.hero{align-items:flex-start;flex-direction:column;}.toolbar{align-items:flex-start;flex-direction:column;}.grid{grid-template-columns:1fr;}h1{font-size:28px;}.footer{flex-direction:column;}}
.languages{display:flex;flex-wrap:wrap;gap:8px}.languages button{display:inline-flex;align-items:center;gap:8px;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;font-size:14px;cursor:pointer}.languages button[aria-pressed="true"]{border-color:#7dd3fc;background:#156082}button:focus-visible{outline:3px solid #7dd3fc}
.app-category{margin-bottom:32px}.category-title{font-size:20px;letter-spacing:.04em;margin:0 0 16px;padding-bottom:10px;border-bottom:1px solid var(--line);color:var(--text)}
</style>
</head>

<body>
<div class="wrapper">

  <section class="hero">
    <div class="brand">
      <div class="logoBox">D</div>
      <div>
        <h1>Dometic App Portal</h1>
        <div class="subtitle">Intern startsida för digitala verktyg, processstöd och förbättringsarbete.</div>
      </div>
    </div>
    <nav class="languages" aria-label="Language"><button data-lang="sv" lang="sv"><svg aria-hidden="true" viewBox="0 0 60 40" width="30" height="20"><rect width="60" height="40" fill="#006aa7"/><path d="M0 20H60M21 0V40" stroke="#fecc00" stroke-width="8"/></svg> Svenska</button><button data-lang="en" lang="en"><svg aria-hidden="true" viewBox="0 0 60 40" width="30" height="20"><rect width="60" height="40" fill="#012169"/><path d="M0 0L60 40M60 0L0 40" stroke="#fff" stroke-width="8"/><path d="M0 0L60 40M60 0L0 40" stroke="#c8102e" stroke-width="3"/><path d="M30 0V40M0 20H60" stroke="#fff" stroke-width="13"/><path d="M30 0V40M0 20H60" stroke="#c8102e" stroke-width="7"/></svg> English</button><button data-lang="de" lang="de"><svg aria-hidden="true" viewBox="0 0 60 40" width="30" height="20"><path fill="#000" d="M0 0H60V14H0Z"/><path fill="#d00" d="M0 14H60V27H0Z"/><path fill="#ffce00" d="M0 27H60V40H0Z"/></svg> Deutsch</button></nav>
  </section>

  <section class="toolbar">
    <input class="search" id="search" placeholder="Sök app..." autocomplete="off">
  </section>

  <div class="notice" id="notice"></div>
  <main id="appGrid"></main>

  <footer class="footer">
    <div>Version 1.4 • Dometic Tidaholm • Intern appportal</div>
    <div>Uppdatera appar i AppLinks.xlsx • Bilder placeras i mappen bilder</div>
  </footer>

</div>

<script>
const portalTexts={"en": ["Internal home page for digital tools, process support and continuous improvement.", "Search apps…", "No apps found.", "Internal app", "Open app", "Version 1.5 • Dometic Tidaholm • Internal app portal", "Update apps in AppLinks.xlsx • Images are stored in the bilder folder", "Could not load AppLinks.xlsx. Showing apps added directly to the portal."], "sv": ["Intern startsida för digitala verktyg, processstöd och förbättringsarbete.", "Sök app…", "Inga appar hittades.", "Intern app", "Öppna app", "Version 1.5 • Dometic Tidaholm • Intern appportal", "Uppdatera appar i AppLinks.xlsx • Bilder placeras i mappen bilder", "Kunde inte läsa AppLinks.xlsx. Visar appar som lagts till direkt i portalen."], "de": ["Interne Startseite für digitale Werkzeuge, Prozessunterstützung und kontinuierliche Verbesserung.", "Apps suchen…", "Keine Apps gefunden.", "Interne App", "App öffnen", "Version 1.5 • Dometic Tidaholm • Internes App-Portal", "Apps in AppLinks.xlsx aktualisieren • Bilder im Ordner bilder ablegen", "AppLinks.xlsx konnte nicht geladen werden. Direkt hinzugefügte Apps werden angezeigt."]};
const appTranslations={"ErgonomicAnalysis": {"en": {"name": "Ergonomics analysis KIM 1", "desc": "Digital risk assessment for lifting and carrying according to KIM I. Calculates a risk score and creates a complete A4 report."}, "de": {"name": "Ergonomieanalyse KIM 1", "desc": "Digitale Risikobewertung für Heben und Tragen gemäß KIM I. Berechnet den Risikowert und erstellt einen vollständigen A4-Bericht."}}, "KIM2": {"en": {"name": "Ergonomics analysis KIM 2", "desc": "Digital risk assessment for pushing and pulling according to KIM II. Calculates a risk score and creates a complete A4 report."}, "de": {"name": "Ergonomieanalyse KIM 2", "desc": "Digitale Risikobewertung für Schieben und Ziehen gemäß KIM II. Berechnet den Risikowert und erstellt einen vollständigen A4-Bericht."}}, "KIM3": {"en": {"name": "Ergonomics analysis KIM 3", "desc": "Digital risk assessment for repetitive work according to KIM III. Calculates a risk score and creates a complete A4 report."}, "de": {"name": "Ergonomieanalyse KIM 3", "desc": "Digitale Risikobewertung für repetitive Arbeit gemäß KIM III. Berechnet den Risikowert und erstellt einen vollständigen A4-Bericht."}}, "Frekvensanalys": {"en": {"name": "Process observations", "desc": "Visualizes how time and activities are distributed across roles or processes. Reveals imbalances, overload and improvement opportunities."}, "de": {"name": "Prozessbeobachtungen", "desc": "Zeigt die Verteilung von Zeit und Tätigkeiten auf Rollen oder Prozesse. Macht Ungleichgewichte, Überlastung und Verbesserungspotenziale sichtbar."}}, "20CycleCheck": {"en": {"name": "20 Cycle Check", "desc": "Digital support for 20 Cycle Check and process observation. Captures variation, deviations and adherence to standards directly at the process."}, "de": {"name": "20 Cycle Check", "desc": "Digitale Unterstützung für 20 Cycle Check und Prozessbeobachtung. Erfasst Streuung, Abweichungen und die Einhaltung von Standards direkt am Prozess."}}, "steptimer": {"en": {"name": "Worksteps & Times", "desc": "Measures cycle time per process step in real time. Provides a quick overview of bottlenecks, variation and deviations from takt time."}, "de": {"name": "Arbeitsschritte & Zeiten", "desc": "Misst die Zykluszeit je Prozessschritt in Echtzeit. Zeigt Engpässe, Streuung und Abweichungen von der Taktzeit."}, "sv": {"name": "Moment-timer"}}, "Funktionsplaneraren": {"en": {"name": "Function planner", "desc": "Visualizes responsibilities and workload for indirect functions. Helps distribute tasks and maintain the right focus."}, "de": {"name": "Funktionsplaner", "desc": "Zeigt Verantwortlichkeiten und Arbeitsbelastung indirekter Funktionen. Unterstützt die Aufgabenverteilung und richtige Priorisierung."}}, "Tolkkalibrering": {"en": {"name": "Gauge calibration", "desc": "Digital app for calibrating hole gauges. Records measurements, calculates the largest deviation from ±0.02 mm and gives an immediate pass or fail result."}, "de": {"name": "Lehrenkalibrierung", "desc": "Digitale App zur Kalibrierung von Lochlehren. Erfasst Messwerte, berechnet die größte Abweichung von ±0,02 mm und zeigt sofort bestanden oder nicht bestanden."}}, "Flagg-generator": {"en": {"name": "Pallet label generator", "desc": "Generates and prints labels for tool pallets. Standardized labeling for clear identification and production traceability."}, "de": {"name": "Palettenetiketten-Generator", "desc": "Erstellt und druckt Kennzeichnungen für Werkzeugpaletten. Standardisierte Kennzeichnung für eindeutige Identifikation und Rückverfolgbarkeit in der Produktion."}}, "DometicPersonalHandbok": {"en": {"name": "Employee handbook", "desc": "Search procedures and employee information. Read Word and PowerPoint on your phone or open the original documents."}, "de": {"name": "Mitarbeiterhandbuch", "desc": "Suchen Sie nach Arbeitsanweisungen und Mitarbeiterinformationen. Lesen Sie Word und PowerPoint auf dem Smartphone oder öffnen Sie die Originaldokumente."}}};
let lang='en';try{const v=localStorage.getItem('dometic-language');if(portalTexts[v])lang=v;}catch(e){}
const t=i=>portalTexts[lang][i];
let loadFailed=false;
appTranslations['Dometic-AnalyzeMovements']={"sv":{"name":"Rörelser & Gångvägar","desc":"Kartlägg operatörens gångvägar i ett spagettidiagram. Följ sträcka, steg och gångtid under en processobservation."},"en":{"name":"Movements & Paths","desc":"Map operator walking paths in a spaghetti diagram. Track distance, steps and walking time during a process observation."},"de":{"name":"Bewegungen & Wege","desc":"Gehwege in einem Spaghetti-Diagramm erfassen. Strecke, Schritte und Gehzeit während einer Prozessbeobachtung verfolgen."}};
function localized(app){const key=Object.keys(appTranslations).find(k=>app.url.toLowerCase().includes('/'+k.toLowerCase()+'/'));const custom=Object.fromEntries(Object.entries(app.i18n?.[lang]||{}).filter(([,v])=>v));return {...app,...appTranslations[key]?.[lang],...custom};}
function filterApps(){const q=document.getElementById('search').value.toLocaleLowerCase().trim();render(apps.filter(a=>{const b=localized(a);return (b.name+' '+b.desc+' '+a.name).toLocaleLowerCase().includes(q);}));}
function applyLanguage(){document.documentElement.lang=lang;document.querySelector('.subtitle').textContent=t(0);document.getElementById('search').placeholder=t(1);document.getElementById('search').setAttribute('aria-label',t(1));document.querySelector('.footer div').textContent=t(5);document.querySelector('.footer div:last-child').textContent=t(6);if(loadFailed)document.getElementById('notice').textContent=t(7);document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===lang)));filterApps();}
const excelFile = "AppLinks.xlsx";
const manualApps = [
  {"name":"Rörelser & Gångvägar","desc":"Kartlägg operatörens gångvägar i ett spagettidiagram. Följ sträcka, steg och gångtid under en processobservation.","url":"https://mrmartinpet.github.io/Dometic-AnalyzeMovements/","image":"bilder/Movements.svg"},
  {
    name: "Ergonomianalys KIM 2",
    desc: "Digital riskbedömning av skjuta- och draarbete enligt KIM II. Beräknar riskpoäng och skapar en komplett A4-rapport.",
    url: "https://mrmartinpet.github.io/KIM2/",
    image: "bilder/Ergonomianalys%20KIM%202.svg"
  },
  {
    name: "Personalhandbok",
    desc: "Sök bland rutiner och personalinformation. Läs Word och PowerPoint direkt i mobilen eller öppna originaldokumenten.",
    url: "https://mrmartinpet.github.io/DometicPersonalHandbok/",
    image: "bilder/Personalhandbok.svg"
  }
];
let apps = [];

function normalizeKey(row){
  const out = {};
  Object.keys(row).forEach(k => out[String(k).trim().toLowerCase()] = row[k]);
  return out;
}

function safeText(value){
  return String(value ?? "").replace(/[&<>'"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]));
}

function imagePath(appName){
  return "bilder/" + encodeURIComponent(String(appName).trim()) + ".jpg";
}

const categoryLabels={en:{process:'PROCESS OBSERVATIONS',other:'OTHER'},sv:{process:'PROCESSOBSERVATIONER',other:'ÖVRIGT'},de:{process:'PROZESSBEOBACHTUNGEN',other:'SONSTIGES'}};
function appCategory(app){const path=new URL(app.url,location.href).pathname.toLowerCase();const otherRepos=['dometicpersonalhandbok','dometic-employee-handbook','funktionsplaneraren','tolkkalibrering','flagg-generator','frekvensanalys'];const names=['personalhandbok','funktionsplaneraren','tolkkalibrering','flagg-generator','flagg generator','frekvensanalys'];return otherRepos.some(repo=>path.split('/').includes(repo))||names.includes(app.name.toLowerCase().trim())?'other':'process';}
function render(list){
  const grid = document.getElementById("appGrid");

  if(!list.length){
    grid.innerHTML = '<div class="empty">'+t(2)+'</div>';
    return;
  }

  const renderCard = app => {
    const original=app;app=localized(app);
    const name = safeText(app.name);
    const desc = safeText(app.desc);
    let target=app.url;if(/\/(20CycleCheck|steptimer|Dometic-AnalyzeMovements)\//i.test(target)){const u=new URL(target);u.searchParams.set('lang',lang);target=u.href;}const url = safeText(target);
    const img = safeText(original.image || imagePath(original.name));

    return `
      <article class="card">
        <div class="image-wrap">
          <img src="${img}" alt="${name}" onerror="this.style.display='none'">
        </div>
        <div class="content">
          <span class="tag"><span class="dot"></span>${t(3)}</span>
          <h3 class="app-title">${name}</h3>
          <div class="desc">${desc}</div>
          <div class="actions">
            <a class="btn" href="${url}" target="_blank" rel="noopener">${t(4)}</a>
            <span class="linktext">${url.replace(/^https?:\/\//,'')}</span>
          </div>
        </div>
      </article>`;
  };
  grid.innerHTML=['process','other'].map(category=>{const group=list.filter(app=>appCategory(app)===category);if(!group.length)return '';return `<section class="app-category" aria-labelledby="category-${category}"><h2 class="category-title" id="category-${category}">${categoryLabels[lang][category]}</h2><div class="grid">${group.map(renderCard).join('')}</div></section>`;}).join('');
}

function addManualApps(){
  manualApps.forEach(app => {
    const exists = apps.some(a => a.name.toLowerCase() === app.name.toLowerCase());
    if(exists) return;

    const kim1Index = apps.findIndex(a => a.name.toLowerCase() === "ergonomianalys kim 1");
    const insertAt = kim1Index >= 0 ? kim1Index + 1 : apps.length;
    apps.splice(insertAt, 0, app);
  });
}

function parseWorkbook(arrayBuffer){
  const wb = XLSX.read(arrayBuffer, {type:"array"});
  const ws = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(ws, {defval:""});

  apps = rows.map(r => {
    const x = normalizeKey(r);

    return {
      name: String(x["appnamn"] || "").trim(),
      desc: String(x["beskrivning"] || x["description"] || "").trim(),
      i18n:{en:{name:x["appnamn_en"],desc:x["beskrivning_en"]},de:{name:x["appnamn_de"],desc:x["beskrivning_de"]}},
      url: String(x["länk"] || x["link"] || "").trim()
    };
  }).filter(a => a.name && a.url);

  addManualApps();
  filterApps();
}

async function loadExcel(){
  try{
    const res = await fetch(excelFile + "?v=" + Date.now());

    if(!res.ok){
      throw new Error("Kunde inte läsa " + excelFile);
    }

    const buffer = await res.arrayBuffer();
    parseWorkbook(buffer);

  }catch(err){
    document.getElementById("notice").style.display = "block";
    loadFailed=true;document.getElementById("notice").textContent=t(7);
    apps = [...manualApps];
    filterApps();
  }
}

document.getElementById('search').addEventListener('input',filterApps);
document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>{lang=b.dataset.lang;try{localStorage.setItem('dometic-language',lang);}catch(e){}applyLanguage();}));
applyLanguage();
loadExcel();
</script>

</body>
</html>
