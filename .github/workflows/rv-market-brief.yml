name: Update RV market brief

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'
      timezone: 'Europe/Stockholm'
  push:
    branches: [main]
    paths:
      - '.github/workflows/rv-market-brief.yml'
      - 'scripts/update-rv-market-brief.py'

permissions:
  contents: write

concurrency:
  group: rv-market-brief
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
      - name: Collect European and Chinese RV updates
        run: python3 scripts/update-rv-market-brief.py
      - name: Publish the public feed
        run: |
          git diff --quiet -- market-intelligence/brief.json && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add market-intelligence/brief.json
          git commit -m "Refresh Europe and China RV market brief"
          git pull --rebase origin main
          git push origin HEAD:main
